# Purple Haze — Doorstop bootstrap for Muck (Unity Mono)
# Place next to Muck.exe with Doorstop's winhttp.dll

[General]
enabled=true
target_assembly=PurpleHaze/core/PurpleHaze.Unity.Mono.dll
redirect_output_log=false
ignore_disable_switch=false

[UnityMono]
dll_search_path_override=
debug_enabled=false
debug_suspend=false
debug_address=127.0.0.1:10000
